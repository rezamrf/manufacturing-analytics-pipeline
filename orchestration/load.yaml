id: deltalake_to_clickhouse
namespace: manufacturing
description: "Pipeline load incremental Delta Lake ke ClickHouse"

tasks:
  - id: load
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: manufacturing-etl:latest
      pullPolicy: IF_NOT_PRESENT
    commands:
      - python delta_to_clickhouse.py --tables "dim_machines,dim_sensors,fact_production_orders,fact_sensor_readings" --unique-keys "dim_machines:machine_id,dim_sensors:sensor_id,fact_production_orders:order_id,fact_sensor_readings:reading_id" --bucket "manufacturing" --delta-prefix "delta" --database "datawarehouse"
