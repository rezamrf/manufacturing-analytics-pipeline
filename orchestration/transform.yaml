id: parquet_to_deltalake
namespace: manufacturing
description: "Pipeline transformasi Parquet incremental menjadi Delta Lake di MinIO"

triggers:
  - id: on_extract_success
    type: io.kestra.plugin.core.trigger.Flow
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionFlowCondition
        namespace: manufacturing
        flowId: postgresql_to_minio
      - type: io.kestra.plugin.core.condition.ExecutionStatusCondition
        in:
          - SUCCESS

tasks:
  - id: transform
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: manufacturing-etl:latest
      pullPolicy: IF_NOT_PRESENT
    commands:
      - python raw_to_deltalake.py --tables "public.dim_machines,public.dim_sensors,public.fact_production_orders,public.fact_sensor_readings" --bucket "manufacturing" --raw-prefix "raw-data/parquet" --delta-prefix "delta"
