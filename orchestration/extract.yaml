id: postgresql_to_minio
namespace: manufacturing
description: "Pipeline ekstraksi tabel dari PostgreSQL ke MinIO"

# Schedule harian pukul 23:00. Aktifkan dengan menghapus tanda #.
#triggers:
#  - id: daily_schedule
#    type: io.kestra.plugin.core.trigger.Schedule
#    cron: "0 23 * * *"

tasks:
  - id: extract
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: manufacturing-etl:latest
      pullPolicy: IF_NOT_PRESENT
    commands:
      - python postgres_to_minio.py --tables "public.dim_machines,public.dim_sensors,public.fact_production_orders,public.fact_sensor_readings" --bucket "manufacturing" --prefix "raw-data"