id: postgresql_to_minio
namespace: manufacturing
description: "Pipeline ekstraksi tabel dari PostgreSQL ke MinIO"

tasks:
  - id: extract
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: manufacturing-etl:v1.0   
      pullPolicy: IF_NOT_PRESENT              
    commands:
      - pip install python-dotenv
      - python postgres_to_minio.py --tables "public.dim_machines,public.dim_sensors,public.fact_production_orders,public.fact_sensor_readings" --bucket "manufacturing" --prefix "raw-data"